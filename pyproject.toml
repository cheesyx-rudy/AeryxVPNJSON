[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeryxvpn-core"
version = "0.2.0"
description = "Shared protocol-aware validation core for AeryxVPN parsers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
geo = [
    "maxminddb>=2.6,<3.0",
    "pycountry>=24.6,<27.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
