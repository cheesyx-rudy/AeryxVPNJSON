[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeryxvpn-json-parser"
version = "1.0.0"
description = "AeryxVPN JSON subscription parser with Core-based proxy validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests[socks]>=2.32,<3.0",
    "PyYAML>=6.0,<7.0",
    "maxminddb>=2.6,<3.0",
    "pycountry>=24.6,<27.0",
    "loguru>=0.7.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["aeryx_json_parser"]
