[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeryx-json-parser"
version = "1.1.0"
description = "One sing-box JSON VPN subscription with country groups and native auto-balancers"
readme = "README_RU.md"
requires-python = ">=3.11"
dependencies = ["requests[socks]>=2.32,<3.0", "PyYAML>=6.0,<7.0", "maxminddb>=2.6,<3", "pycountry>=24.6,<27"]

[project.scripts]
aeryx-json-parser = "aeryx_json_parser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
