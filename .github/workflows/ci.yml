name: JSON Parser CI

on:
  push:
    branches:
      - main
      - release/1.0.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout JSON parser
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Checkout pinned AeryxVPN Core 0.10.0
        uses: actions/checkout@v5
        with:
          repository: cheesyx-rudy/AeryxVPN-Core
          ref: 1c8dd073654cd96598154ba94d5439ab6782bd2c
          token: ${{ secrets.AERYX_CORE_READ_TOKEN }}
          path: .aeryx-core
          persist-credentials: false

      - name: Build and install Core wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/aeryx-core-wheel"
          mkdir -p "$wheel_dir"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" ./.aeryx-core
          wheel="$(find "$wheel_dir" -maxdepth 1 -name 'aeryxvpn_core-0.10.0-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --no-cache-dir "$wheel"

      - name: Install JSON parser and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Verify pinned Core package and public API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib import metadata
          import aeryx_core
          from aeryx_core import (
              MihomoConfigBuilder,
              MihomoProtocolValidator,
              ShareURIAdapter,
              create_validation_engine,
          )

          assert metadata.version("aeryxvpn-core") == "0.10.0"
          assert aeryx_core.__version__ == "0.10.0"
          assert ShareURIAdapter and callable(create_validation_engine)
          assert MihomoConfigBuilder and MihomoProtocolValidator
          print("AeryxVPN Core 0.10.0 import check passed")
          PY

      - name: Run complete offline test suite
        run: python -m pytest -q -ra

      - name: Compile parser modules
        run: python -m compileall -q src

      - name: Live smoke-test official Xray, sing-box, and Mihomo downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/install_cores.py --platform linux --arch amd64
          test -s tools/xray
          test -s tools/sing-box
          test -s tools/mihomo
          ./tools/xray version
          ./tools/sing-box version
      - name: Validate generated Mihomo YAML with the official binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import subprocess
          import tempfile
          from pathlib import Path

          import yaml
          from aeryx_core import MihomoConfigBuilder, ShareURIAdapter

          public_key = "B6N8vBQgk8i3VdwbEOhstCY3StFqqFPtC9/AsrhtHHw="
          samples = [
              (
                  "vless://11111111-1111-1111-1111-111111111111@127.0.0.1:443?"
                  f"security=reality&sni=example.com&pbk={public_key}&sid=abcd&"
                  "type=ws&host=example.com&path=%2F#reality-ws"
              ),
              (
                  "hysteria2://secret@127.0.0.1:443?sni=example.com&"
                  "obfs=salamander&obfs-password=secret#hy2"
              ),
              (
                  "trojan://secret@127.0.0.1:443?sni=example.com&"
                  "type=grpc&serviceName=grpc#trojan-grpc"
              ),
          ]

          builder = MihomoConfigBuilder()
          for index, uri in enumerate(samples, start=1):
              candidate = ShareURIAdapter().parse(uri)[0]
              config = builder.build(candidate, 23000 + index)
              with tempfile.TemporaryDirectory(prefix="mihomo-config-smoke-") as data_dir:
                  config_path = Path(data_dir) / "config.yaml"
                  config_path.write_text(
                      yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
                      encoding="utf-8",
                  )
                  result = subprocess.run(
                      [
                          str(Path("tools/mihomo").resolve()),
                          "-t",
                          "-f",
                          str(config_path),
                          "-d",
                          data_dir,
                      ],
                      capture_output=True,
                      text=True,
                      timeout=20,
                      check=False,
                  )
                  if result.returncode:
                      raise SystemExit(
                          f"Mihomo rejected sample {index}: "
                          f"{result.stdout!r}; {result.stderr!r}"
                      )
          print("Mihomo accepted generated VLESS-Reality, Hysteria2 and Trojan configs.")
          PY

      - name: Lint new Core integration files
        run: python -m ruff check src/aeryx_json_parser/core_validation.py tests/test_core_validation.py
