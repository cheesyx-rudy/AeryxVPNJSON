name: AeryxVPN Happ Xray JSON-array subscription

on:
  workflow_dispatch:
  # Cloudflare Worker starts the JSON parser through GitHub repository_dispatch.
  repository_dispatch:
    types: [aeryxvpn-update]

permissions:
  contents: write
  actions: read

concurrency:
  group: aeryxjson-subscription-update
  cancel-in-progress: false

jobs:
  build-happ-json-array:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: src
      PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
      PANEL_SESSION: ${{ secrets.PANEL_SESSION }}
      SUB_TOKEN: ${{ secrets.SUB_TOKEN }}
      HAPP_HWID: ${{ secrets.HAPP_HWID }}
      WEP_SOURCE_URL: ${{ secrets.WEP_SOURCE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Require read-only Core access token
        env:
          CORE_TOKEN: ${{ secrets.AERYX_CORE_READ_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${CORE_TOKEN:-}" ]]; then
            echo '::error::Configure AERYX_CORE_READ_TOKEN with read-only access to AeryxVPN-Core.'
            exit 1
          fi

      - name: Checkout pinned AeryxVPN Core
        uses: actions/checkout@v7
        with:
          repository: cheesyx-rudy/AeryxVPN-Core
          ref: 1c8dd073654cd96598154ba94d5439ab6782bd2c
          token: ${{ secrets.AERYX_CORE_READ_TOKEN }}
          path: .aeryx-core
          persist-credentials: false

      - name: Verify Core source checkout
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'version = "0.10.0"' .aeryx-core/pyproject.toml
          test -f .aeryx-core/src/aeryx_core/validation/core_validators.py
          test -f .aeryx-core/src/aeryx_core/cores/mihomo.py

      - name: Build and install pinned Core wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/aeryx-core-wheel"
          mkdir -p "$wheel_dir"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" ./.aeryx-core
          wheel="$(find "$wheel_dir" -maxdepth 1 -name 'aeryxvpn_core-0.10.0-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --no-cache-dir --force-reinstall "$wheel"

      - name: Install parser and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Verify installed Core API
        shell: bash
        run: |
          set -euo pipefail
          env -u PYTHONPATH python -I - <<'PY'
          from importlib import metadata
          import aeryx_core
          from aeryx_core import (
              MihomoConfigBuilder,
              MihomoProtocolValidator,
              ShareURIAdapter,
              create_validation_engine,
          )

          assert metadata.version("aeryxvpn-core") == "0.10.0"
          assert aeryx_core.__version__ == "0.10.0"
          assert ShareURIAdapter and callable(create_validation_engine)
          assert MihomoConfigBuilder and MihomoProtocolValidator
          print("AeryxVPN Core 0.10.0: OK")
          PY

      - name: Verify parser runtime resolves AeryxVPN Core 0.10.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib import metadata
          from pathlib import Path
          import aeryx_core
          import aeryx_json_parser.core_validation as adapter

          expected = "0.10.0"
          actual = metadata.version("aeryxvpn-core")
          if actual != expected or aeryx_core.__version__ != expected:
              raise SystemExit(
                  f"Expected Core {expected}; distribution={actual}, module={aeryx_core.__version__}"
              )
          module_path = Path(aeryx_core.__file__).resolve()
          if ".aeryx-core" in module_path.parts:
              raise SystemExit(f"Parser unexpectedly imports a source checkout instead of the installed wheel: {module_path}")
          print(f"Parser Core version: {actual}")
          print(f"Parser Core module: {module_path}")
          print(f"Parser adapter: {Path(adapter.__file__).resolve()}")
          PY

      - name: Run offline tests
        run: python -m pytest -q -ra

      - name: Check whether sources.txt has active URLs
        id: source_check
        shell: bash
        run: |
          if grep -Eq '^[[:space:]]*(https?://|\$\{[A-Za-z_][A-Za-z0-9_]*\})' sources.txt; then
            echo 'has_sources=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_sources=false' >> "$GITHUB_OUTPUT"
            echo 'No source URLs configured. Tests passed; generation is skipped without changing published files.'
          fi

      - name: Download DB-IP Lite country database
        if: steps.source_check.outputs.has_sources == 'true'
        run: python tools/download_geoip.py --output output/dbip-country-lite.mmdb

      - name: Install official stable Xray, sing-box, and Mihomo cores
        if: steps.source_check.outputs.has_sources == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/install_cores.py --platform linux --arch amd64

      - name: Validate generated Mihomo YAML with the official binary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import subprocess
          import tempfile
          from pathlib import Path

          import yaml
          from aeryx_core import MihomoConfigBuilder, ShareURIAdapter

          public_key = "B6N8vBQgk8i3VdwbEOhstCY3StFqqFPtC9_AsrhtHHw"
          samples = [
              (
                  "vless://11111111-1111-1111-1111-111111111111@127.0.0.1:443?"
                  f"security=reality&sni=example.com&pbk={public_key}&sid=abcd&"
                  "type=ws&host=example.com&path=%2F#reality-ws"
              ),
              (
                  "hysteria2://secret@127.0.0.1:443?sni=example.com&"
                  "obfs=salamander&obfs-password=secret#hy2"
              ),
              (
                  "trojan://secret@127.0.0.1:443?sni=example.com&"
                  "type=grpc&serviceName=grpc#trojan-grpc"
              ),
          ]

          builder = MihomoConfigBuilder()
          for index, uri in enumerate(samples, start=1):
              candidate = ShareURIAdapter().parse(uri)[0]
              config = builder.build(candidate, 23000 + index)
              with tempfile.TemporaryDirectory(prefix="mihomo-config-smoke-") as data_dir:
                  config_path = Path(data_dir) / "config.yaml"
                  config_path.write_text(
                      yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
                      encoding="utf-8",
                  )
                  result = subprocess.run(
                      [
                          str(Path("tools/mihomo").resolve()),
                          "-t",
                          "-f",
                          str(config_path),
                          "-d",
                          data_dir,
                      ],
                      capture_output=True,
                      text=True,
                      timeout=20,
                      check=False,
                  )
                  if result.returncode:
                      raise SystemExit(
                          f"Mihomo rejected sample {index}: "
                          f"{result.stdout!r}; {result.stderr!r}"
                      )
          print("Mihomo accepted generated VLESS-Reality, Hysteria2 and Trojan configs.")
          PY
      - name: Fetch, parse, filter and tunnel-check source configs
        if: steps.source_check.outputs.has_sources == 'true'
        run: python -m aeryx_json_parser --check proxy --max-runtime 360

      - name: Upload Mos.Hub candidate package
        id: moshub_input
        if: ${{ success() && hashFiles('output/moshub-request.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: moshub-input-json-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/moshub-request.json
          if-no-files-found: error
          retention-days: 1

      - name: Request secondary validation on Mos.Hub
        if: ${{ success() && steps.moshub_input.outputs['artifact-id'] != '' }}
        continue-on-error: true
        env:
          MOSHUB_API_URL: ${{ secrets.MOSHUB_API_URL }}
          MOSHUB_PROJECT_ID: ${{ secrets.MOSHUB_PROJECT_ID }}
          MOSHUB_TRIGGER_TOKEN: ${{ secrets.MOSHUB_TRIGGER_TOKEN }}
          MOSHUB_READ_API_TOKEN: ${{ secrets.MOSHUB_READ_API_TOKEN }}
          MOSHUB_ARTIFACT_ID: ${{ steps.moshub_input.outputs['artifact-id'] }}
          MOSHUB_ARTIFACT_NAME: moshub-input-json-${{ github.run_id }}-${{ github.run_attempt }}
          MOSHUB_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          MOSHUB_PARSER_KIND: json
          MOSHUB_LOCAL_REPORT: output/engine/validation_report.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python tools/moshub_bridge.py

      - name: Build Happ JSON array
        if: steps.source_check.outputs.has_sources == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: >-
          python -m aeryx_json_parser.json_builder
          --input output/engine/parsed_proxies.json
          --output output/publish
          --repository "$GITHUB_REPOSITORY"
          --branch main
          --xray tools/xray

      - name: Validate every Happ profile with Xray-core
        if: steps.source_check.outputs.has_sources == 'true'
        run: python tools/validate_outputs.py --root output/publish --xray tools/xray

      - name: Upload safe build diagnostics
        if: always() && steps.source_check.outputs.has_sources == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aeryxjson-build-report
          path: |
            output/engine/validation_report.json
            output/engine/progress.jsonl
            output/publish/build-report.json
            output/tools/core-versions.json
            tools/core-versions.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the Happ JSON-array subscription and metadata
        if: success() && steps.source_check.outputs.has_sources == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -s output/publish/AeryxVPN.json
          test -s output/publish/AeryxVPN.metadata.json
          test -s output/publish/build-report.json
          install -m 0644 output/publish/AeryxVPN.json AeryxVPN.json
          install -m 0644 output/publish/AeryxVPN.metadata.json AeryxVPN.metadata.json

          git rm -r --ignore-unmatch countries xray country-metadata
          git rm --ignore-unmatch index.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'AeryxVPN JSON subscription is unchanged; no commit needed.'
          else
            git commit -m 'Update unified AeryxVPN JSON subscription'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "JSON subscription published successfully."
                exit 0
              fi
              echo "Push attempt ${attempt} failed; refreshing main."
              sleep 2
            done
            echo '::error::Could not publish JSON subscription after three attempts.'
            exit 1
          fi
